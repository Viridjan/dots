[general]
import = [
  "~/.config/alacritty/dank-theme.toml"
]

[font]
size = 11.0
normal = { family = "MesloLGS Nerd Font Mono", style = "Regular" }
bold   = { family = "MesloLGS Nerd Font Mono", style = "Bold" }
italic = { family = "MesloLGS Nerd Font Mono", style = "Italic" }

[window]
decorations = "None"
padding = { x = 16, y = 16 }
dynamic_padding = true
opacity = 0.9

[scrolling]
history = 3023

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[bell]
duration = 0

[keyboard]
bindings = [
  { key = "C",       mods = "Control",       action = "Copy"   },
  { key = "C",       mods = "Control|Shift", chars  = "\x03"   },
  { key = "N",       mods = "Control", action = "SpawnNewInstance" },
  { key = "Equals",  mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",   mods = "Control",       action = "DecreaseFontSize" },
  { key = "Key0",    mods = "Control",       action = "ResetFontSize"    },
  { key = "Enter",   mods = "Shift",         chars = "\n" },
  { key = "Return",  mods = "Shift",         chars = "\r" },
]
