description = "Surface Pro 9 \u2014 touch, stylus"
# Substring of the hostname; preselected on first run and used by `vjupdate` without a config.
hostname = "surface"
# Default dotfile set (dotsets/<name>/); each machine may pick another.
dotset = "viridjan"
# Behaviour switches read by vjupdate (_has_feature).
features = ["linux-surface"]

[paru]
install = [
    # Surface Pro 9 packages — Intel 12th gen + Iris Xe
    #
    # NOTE: vjupdate adds the linux-surface pacman repo to pacman.conf automatically.
    # Secure Boot key enrollment needed for linux-surface kernel — see INSTALL.md.

    # Surface kernel (linux-surface repo — includes all surface patches: WiFi, touchscreen, pen, camera)
    "linux-surface",
    "linux-surface-headers",

    # Touchscreen daemon (requires linux-surface kernel)
    "iptsd",

    # Surface hardware control (Fn keys, performance mode, battery limit)
    "surface-control",

    # Accelerometer / auto-rotate support
    "iio-sensor-proxy",

    # Surface Pen (Wacom protocol)
    "libwacom",

    # Power management
    "tlp",
    "tlp-rdw",
    "thermald",

    # Backlight control (niri keybinds)
    "brightnessctl",

    # NVMe management
    "nvme-cli",

    # Intel Iris Xe GPU drivers
    "vulkan-intel",
    "lib32-vulkan-intel",
    "intel-media-driver",
    "intel-compute-runtime",
]
