description = "Tower \u2014 AMD RX 6700 XT, i5-13400F"
# Substring of the hostname; preselected on first run and used by `vjupdate` without a config.
hostname = "desktop"
# Default dotfile set (dotsets/<name>/); each machine may pick another.
dotset = "viridjan"
# Behaviour switches read by vjupdate (_has_feature).
features = ["desktop-services", "cpu-performance", "amd-gpu-tuning", "ollama-model", "windows-vm"]

[paru]
install = [
    # Desktop-specific packages — AMD RX 6700 XT + i5-13400F tower

    # AMD GPU drivers (Wayland — xf86-video-amdgpu not needed)
    "vulkan-radeon",
    "lib32-vulkan-radeon",
    "opencl-mesa",
    "lib32-opencl-mesa",

    # Desktop peripherals

    # AI / local LLM
    "ollama-rocm",

    # Games: launcher for GitHub/GitLab release ports (AUR wraps the upstream AppImage)
    "quiver-launcher-bin",

    # VR: Pico 4 Ultra streaming (alvr/alvr-git are on the malware blocklist; -bin reviewed 2026-11-01).
    # Headset client APK must match `pacman -Q alvr-bin`.
    "alvr-bin",
]

[systemd]
# limine-snapper-sync: limine machines only (the Surface boots via GRUB)
enable = ["ollama", "limine-snapper-sync.service"]
