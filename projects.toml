# Git repositories cloned into ~/Projects/ by the sources phase.
# Optional `build`: run in the repo by install and --update after a
# fast-forward pull, only when HEAD changed (skipped while the tree has local changes).

[[repo]]
name = "dux-player"
url = "https://github.com/Conava/dux-player.git"
build = "git submodule update --init --recursive && make build && make install PREFIX=\"$HOME/.local\""

