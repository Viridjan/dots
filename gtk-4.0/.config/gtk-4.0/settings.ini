# ────────────── GTK 4 Settings ──────────────
# These settings are applied to all GTK4 applications.
# They are typically managed by GUI tools like nwg-look or lxappearance —
# running those tools will overwrite this file.
# Reference: https://wiki.archlinux.org/title/GTK#Configuration

[Settings]
# Use the dark variant of the theme when the app supports it.
gtk-application-prefer-dark-theme=true

# Show icons on buttons (e.g. OK/Cancel dialogs). GTK4 may ignore this.
gtk-button-images=true

# Cursor theme name. Must match a theme in /usr/share/icons/ or ~/.local/share/icons/.
gtk-cursor-theme-name=capitaine-cursors

# Cursor size in pixels. Common values: 16, 24, 32.
gtk-cursor-theme-size=24

# Enable GTK widget animations (window transitions, hover effects, etc.).
gtk-enable-animations=true

# Default UI font. Format: "Family[, Style] Size"
gtk-font-name=Fira Sans,  10

# Show icons in menus. GTK4 may ignore this.
gtk-menu-images=true

# Loaded GTK modules. colorreload: live-reloads theme colors. appmenu: global menu support.
gtk-modules=colorreload-gtk-module:appmenu-gtk-module

# When true, clicking a slider jumps to the clicked position instead of scrolling.
gtk-primary-button-warps-slider=false

# Show the app menu in the shell menubar (used by GNOME Shell and similar).
gtk-shell-shows-menubar=1

# GTK theme. Note: GTK4 uses libadwaita by default and may ignore this setting
# unless the app explicitly opts into GTK3-style theming.
gtk-theme-name=cachyos-nord
