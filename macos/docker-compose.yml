services:
  macos:
    image: dockurr/macos
    container_name: macos
    environment:
      VERSION: "sequoia"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "128G"
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1080"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - 8007:8006   # web UI (noVNC) — 8007 avoids conflict with windows on 8006
    volumes:
      - ./storage:/storage
    restart: on-failure
    stop_grace_period: 2m
