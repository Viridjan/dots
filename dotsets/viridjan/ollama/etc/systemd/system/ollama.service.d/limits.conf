# Cap ollama at ~40% of the machine.
[Service]
# CPU: 40% of 16 threads (100% = one thread).
CPUQuota=640%
# RAM: soft cap at 40% of physical memory (incl. CPU-offloaded layers).
# MemoryHigh throttles and reclaims/swaps above the line; never OOM-kills.
MemoryHigh=40%
# VRAM: no cgroup control for GPUs, and ollama 0.40 ignores
# OLLAMA_GPU_OVERHEAD and OLLAMA_MAX_LOADED_MODELS (2026-10-30: both models
# loaded, 11.7 of 12 GB VRAM). VRAM caps are per model: num_gpu in
# scripts/.local/share/ollama/*.Modelfile. GPU compute can't be capped.
# Unload idle models after 1 min so two rarely share VRAM.
Environment=OLLAMA_KEEP_ALIVE=1m
Environment=OLLAMA_NUM_PARALLEL=1
