# Cap ollama at ~40% of the machine.
[Service]
# CPU: 40% of 16 threads (100% = one thread).
CPUQuota=640%
# RAM: soft cap at 40% of physical memory (incl. CPU-offloaded layers).
# MemoryHigh throttles and reclaims/swaps above the line; never OOM-kills.
MemoryHigh=40%
# VRAM: no cgroup control for GPUs. Reserve 60% of the RX 6700 XT's 12 GB
# so ollama only places ~4.8 GB of layers there; the rest run on CPU.
# GPU compute (utilisation) cannot be capped.
Environment=OLLAMA_GPU_OVERHEAD=7720874803
# One model, one request at a time.
Environment=OLLAMA_MAX_LOADED_MODELS=1
Environment=OLLAMA_NUM_PARALLEL=1
