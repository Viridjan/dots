# Owner's caps: GPU memory 5 GB, CPU 8 threads, RAM 60%, GPU compute 60%.
[Service]
# CPU: 8 of 16 threads (100% = one thread).
CPUQuota=800%
# RAM: soft cap at 60% of physical memory (incl. CPU-offloaded layers).
# MemoryHigh throttles and reclaims/swaps above the line; never OOM-kills.
MemoryHigh=60%
# VRAM: no cgroup control for GPUs, and ollama 0.40 ignores
# OLLAMA_GPU_OVERHEAD and OLLAMA_MAX_LOADED_MODELS (2026-10-30: both models
# loaded, 11.7 of 12 GB VRAM). VRAM caps are per model: num_gpu in
# scripts/.local/share/ollama/*.Modelfile.
# GPU compute: ROCm CU mask, GPU 0, compute units 0-23 = 24 of the RX 6700 XT's 40 (60%).
# ponytail: CU mask unverified with ollama's bundled ROCm; check tokens/s drops after restart.
Environment=HSA_CU_MASK=0:0-23
# Unload idle models after 1 min so two rarely share VRAM.
Environment=OLLAMA_KEEP_ALIVE=1m
Environment=OLLAMA_NUM_PARALLEL=1
