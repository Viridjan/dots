# Replaces /usr/share/xdg-desktop-portal/niri-portals.conf (only the first file
# found is read), so the system entries are copied here. Added: ScreenCast goes
# to niri-autoselect-portal (packages.toml) - no picker, it shares niri's
# dynamic cast target (Mod+Ctrl+S window, Mod+Ctrl+Shift+S monitor).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.ScreenCast=niri-autoselect;
