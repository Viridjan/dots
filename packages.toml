# Package lists shared by every profile. Per-profile lists: profiles/<name>.toml.
# Per-machine changes go in ~/.config/vjupdate/config.toml, not here.
# Install priority: pacman > flatpak > paru (AUR). Check new AUR names against
# the malware blocklist first (see CLAUDE.md).

[paru]
# Installed on every machine.
install = [
    # Common packages — installed on both desktop and surface

    # Gaming
    "cachyos-gaming-meta",
    "gamemode",
    "protonup-qt",
    "gamescope",
    "goverlay",
    "lib32-mangohud",
    "mangohud",
    "steam",
    "wqy-zenhei",
    "wine-cachyos",

    # Graphics (CachyOS repo mesa is already optimized)
    "mesa",
    "lib32-mesa",

    # Flatpak runtime
    "flatpak",

    # Wayland / niri desktop stack
    "xwayland-satellite",
    "xdg-desktop-portal-gtk",
    "xdg-desktop-portal-gnome",
    "gnome-keyring",
    "polkit-kde-agent",
    "cliphist",
    "wl-clipboard",
    "matugen",
    "qt6-multimedia-ffmpeg",

    # System tools
    "fwupd",
    "kimageformats",
    "cava",
    "fish",
    "fisher",
    "cups",
    "cups-pk-helper",
    "micro",
    "tree",
    "bitwarden",
    "stow",
    "i2c-tools",
    "profile-sync-daemon",
    "bpftune-git",
    "dmemcg-booster",
    "plasma-foreground-booster",
    "intel-lpmd",
    "openssh",
    "pacman-contrib",
    "rebuild-detector",
    "shellcheck",
    "git",
    "cmake",
    "gparted",
    # gperf: makedepend for lib32-libid3tag (AUR), pulled in when rebuilding lib32-imlib2
    "gperf",
    "rsync",
    "smartmontools",
    "ffmpegthumbnailer",
    "unrar",

    # Display manager
    "dms-shell",
    "greetd-dms-greeter-git",

    # Btrfs snapshots
    "snapper",
    "snap-pac",
    "btrfs-assistant",
    # inotify-tools: required by limine-snapper-watcher (limine-snapper-sync.service)
    "inotify-tools",

    # Music
    "mpd",
    "rmpc",
    "spotify-player",
    "playerctl",

    # Applications
    "thunderbird",
    "nicotine+",
    "vlc",
    "vlc-plugins-all",
    "qbittorrent",
    "vesktop",
    "udiskie",
    "libreoffice-still",
    "joplin-desktop",
    "zathura",
    "zathura-pdf-poppler",
    "poppler-glib",
    "meld",
    "pavucontrol",
    "vscodium",
    "shelly",
    "gwenview",
    "fprintd",

    # AUR
    "quickshell",
    "dgop",
    "dsearch-bin",
    "whatsie",
    "telegram-desktop",
    "claude-code",
    "rofi-ykman-git",

    # Chromium (webapp launcher — used by .desktop app shortcuts)
    "chromium",

    # Development
    "nodejs-lts-krypton",
    "npm",
    "git-filter-repo",
    "github-cli",
    "godot",

    # Containers (Open Notebook)
    "docker",
    "docker-compose",

    # Optional — file manager
    "dolphin",
    "yazi",

    # Theme extras
    "satty",
    "chafa",

    # Terminal & fonts
    "alacritty",
    "ttf-meslo-nerd",
    "ttf-space-mono-nerd",
    "awesome-terminal-fonts",

    # CLI tools
    # jq: used by the Claude Code statusline segments (model, topic, dir)
    # python-textual: the vj terminal UI (scripts/.local/bin/vj)
    "python-textual",
    "jq",
    "ripgrep",
    "btop",
    "duf",
    "glances",
    "fastfetch",
    "plocate",
    "pv",
    "xdotool",
    "xorg-xwininfo",
    "yad",
    "libdvdcss",
    # Network / firewall
    "ufw",
    "ufw-extras",
    "networkmanager-openvpn",
    "samba",

    # Editors
    "geany",

    # Graphics
    "kolourpaint",
    "freecad",
    "vectorcraft",
    "gridcraft",
    "pdfcraft",
    "wordcraft",
    "photocraft",
    "filmcraft",
    "lightcraft",
    "effectcraft",
    "designcraft",
    "soundcraft",
    "deckcraft",
    "cadcraft",
    "figcraft",

    # Browsers
    "brave-origin-bin",
    "firefox",

    # ML
    "unsloth",
]

# Force-removed (pacman -Rdd) before installing — conflict resolution.
remove = [
    "sddm",
    "libreoffice-fresh",
    "bambustudio-appimage",
    "ghostty",
    "cachyos-niri-noctalia",
    "noctalia-qs",
    "noctalia-shell",
    "wine",
    "cachyos-gaming-applications",
    "heroic-games-launcher",
    "lutris",
    "nodejs-lts-jod",
    "brave-bin",
    "gomuks",
    "gomuks-web-bin",
    "proton-cachyos",
    "proton-cachyos-native",
    "electron37",
    "xorg-server",
    "xf86-input-libinput",
    "adw-gtk-theme",
    "capitaine-cursors",
    "cachyos-alacritty-config",
    "wlr-randr",
    "brightnessctl",
    "gpsd",
]

hold = [
    # Installed normally, but excluded from automatic upgrades and rebuilds.
    # Upgrade by hand after reviewing the PKGBUILD and upstream release.
]

# Skipped by install and audit even if listed above.
skip = [
    # Packages to skip during vjupdate install phases.
    # One package per line. Lines starting with # are ignored.
    # Edit by hand; read by the install and audit phases of vjupdate.
]

[flatpak]
install = [
    # Flatpak apps — both machines

    # Applications
    "com.usebottles.bottles",
    "com.spotify.Client",
    "ch.protonmail.protonmail-bridge",
    "com.bambulab.BambuStudio",
    "xyz.xclicker.xclicker",
    # com.ktechpit.whatsie — now installed via AUR (whatsie) instead
    "org.nomacs.ImageLounge",

    # Emulators
    "app.xemu.xemu",
    "com.supermodel3.Supermodel",
    "io.github.shiiion.primehack",
    "net.kuribo64.melonDS",
    "org.DolphinEmu.dolphin-emu",
    "org.libretro.RetroArch",
    "org.ppsspp.PPSSPP",
    "org.scummvm.ScummVM",
]
