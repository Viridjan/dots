# Package lists shared by every profile. Per-profile lists: profiles/<name>.toml.
# Per-machine changes go in ~/.config/sysup/config.toml, not here.
# Install priority: pacman > flatpak > paru (AUR). Check new AUR names against
# the malware blocklist first (see CLAUDE.md).

[paru]
# Installed on every machine.
install = [
    # Common packages — installed on both desktop and surface

    # Gaming
    "cachyos-gaming-meta",
    "gamemode",
    "gamescope",
    "lib32-mangohud",
    "mangohud",
    "steam",
    "wqy-zenhei",
    "wine-cachyos",
    "emudeck-bin",  # its scripts need fuse2/unzip/zenity
    "fuse2",
    "unzip",
    "zenity",

    # Graphics (CachyOS repo mesa is already optimized)
    "mesa",
    "lib32-mesa",

    # Flatpak runtime
    "flatpak",

    # Wayland / niri desktop stack
    "xwayland-satellite",
    "xdg-desktop-portal-gtk",
    "xdg-desktop-portal-gnome",
    "gnome-keyring",
    "polkit-kde-agent",
    "cliphist",
    "wl-clipboard",
    "matugen",
    "qt6-multimedia-ffmpeg",

    # niri IPC helpers (from awesome-niri; started in config.kdl)
    "nirius",                      # niriusd + focus-or-spawn/scratchpad/follow commands
    "nirinit",                     # save/restore window layout (skip list: dotset nirinit)

    # System tools
    "fwupd",
    "kimageformats",
    "cava",
    "fish",
    "fisher",
    "cups",
    "cups-pk-helper",
    "micro",  # the editor; vim is in [paru].remove
    "zsh",    # explicit: removing cachyos-zsh-config would orphan it (Claude Code's shell)
    "tree",
    "ghidra",  # native backend for REA (rea-agents, [npm]); pulls a JDK
    "bitwarden",
    "stow",
    "i2c-tools",
    "profile-sync-daemon",
    "bpftune-git",
    "dmemcg-booster",
    "plasma-foreground-booster",
    "intel-lpmd",
    "openssh",
    "pacman-contrib",
    "rebuild-detector",
    "shellcheck",
    "git",
    "cmake",
    "gparted",
    # gperf: makedepend for lib32-libid3tag (AUR), pulled in when rebuilding lib32-imlib2
    "gperf",
    "rsync",
    "smartmontools",
    "ffmpegthumbnailer",
    "unrar",

    # Display manager
    "dux-shell",  # DMS renamed by CachyOS 2026-10-30; still ships dms + dms.service
    "dux-greeter-bin",  # Dux greeter (-git until 2026-11-10); still ships dms-greeter (install/sync/--command)
    "dux-files-bin",  # Dux file manager (2026-11-10)
    "dux-calendar-bin",  # Dux calendar: local, Google, Microsoft, CalDAV
    "dux-shell-plugins-git",  # first-party plugins in /usr/share/quickshell/dux-shell/plugins; link the ones to enable into ~/.config/dms/plugins

    # Btrfs snapshots
    "snapper",
    "snap-pac",
    "btrfs-assistant",
    # inotify-tools: required by limine-snapper-watcher (limine-snapper-sync.service)
    "inotify-tools",

    # Music
    "beets",  # music library organizer and tagger (beet)
    "kid3",  # audio tag editor
    "mpv",  # dux-player playback backend
    "mpd",
    "rmpc",
    "spotify-player",
    "playerctl",
    "nicotine+",  # Soulseek client (re-added 2026-11-03)

    # Applications
    "thunderbird",
    "vlc",
    "vlc-plugins-all",
    "qbittorrent",
    "vesktop",
    "stoat-desktop-bin",  # Stoat (ex-Revolt) chat; Flathub only has the old Revolt 1.0.8
    "udiskie",
    "joplin-desktop",
    "poppler-glib",
    "pavucontrol",
    "vscodium",
    "shelly",
    "fprintd",

    # AUR
    "quickshell",
    "dux-gop",  # dgop renamed by CachyOS 2026-10-30
    "dux-search-bin",  # dsearch-bin renamed (2026-11-10)
    "whatsie",
    "telegram-desktop",
    "claude-code",
    "tmux",
    "rofi-ykman-git",

    # Chromium (webapp launcher — used by .desktop app shortcuts)
    "chromium",

    # Development
    "go",  # builds dux-player (projects.toml)
    "nodejs-lts-krypton",
    "npm",
    "uv",  # runs the [uv] tools (graphifyy)
    "git-filter-repo",
    "github-cli",
    "godot",
    "rust",  # cargo: builds 7000bar (projects.toml build)

    # Containers (Open Notebook)
    "docker",
    "docker-compose",

    # Spell-check dictionaries (wordcraft, enchant/GTK apps read /usr/share/hunspell)
    "hunspell-it",
    "hunspell-en_gb",
    "hunspell-en_us",

    # Theme extras
    "satty",
    "chafa",

    # Terminal & fonts
    "alacritty",
    "ttf-meslo-nerd",
    "ttf-space-mono-nerd",
    "awesome-terminal-fonts",

    # CLI tools
    # jq: used by the Claude Code statusline segments (model, topic, dir)
    "jq",
    # fzf: the bare `sysup` menu
    "fzf",
    "ripgrep",
    "duf",
    "glances",
    "fastfetch",
    "plocate",
    "pv",
    "xdotool",
    "xorg-xwininfo",
    "yad",
    "libdvdcss",
    # Network / firewall
    "ufw",
    "ufw-extras",
    "networkmanager-openvpn",
    "samba",

    # Editors

    # Graphics
    "freecad",
    "vectorcraft-bin",
    "gridcraft-bin",
    "pdfcraft-bin",
    "wordcraft-bin",
    "photocraft-bin",
    "designcraft-bin",
    "deckcraft-bin",
    "cadcraft-bin",
    "figcraft-bin",
    "solidcraft-bin",  # parametric 3D CAD (tangency-labs)

    # Browsers
    "brave-origin-bin",
]

# Force-removed (pacman -Rdd) before installing. Usually unneeded now: a
# listed package that conflicts with an installed one replaces it in the same
# transaction (paru --ask=4), and nothing is removed if the build fails. List
# here only what must go first (e.g. tlp) or has no direct conflict.
remove = [
    "deadbeef",  # removed: use the existing media players
    # unused file managers; Dux Files (dux-files-bin) is the file manager (2026-11-10)
    "yazi",
    "dolphin",
    # broke Vesktop streams: two pending casts, wrong-stream signal closes the session (2026-11-10)
    "niri-autoselect-portal-git",
    # tlp: power-profiles-daemon.service has Conflicts=tlp.service (2026-11-01)
    "tlp",
    "tlp-rdw",
    # vim → micro (2026-11-01). cachyos-zsh-config requires vim; zsh stays plain.
    "vim",
    "vim-runtime",
    "cachyos-zsh-config",
    # Plain nodejs conflicts with the listed nodejs-lts-krypton (pacman
    # --noconfirm declines the swap prompt); the LTS package provides nodejs.
    "nodejs",
    # oniri: auto-maximized a workspace's lone window; dropped 2026-10-31
    "oniri",
    # Source builds replaced by their -bin packages (2026-10-25)
    "vectorcraft",
    "gridcraft",
    "pdfcraft",
    "wordcraft",
    "photocraft",
    "designcraft",
    "deckcraft",
    "cadcraft",
    "figcraft",
    "sddm",
    "libreoffice-fresh",
    "libreoffice-still",
    # KiCad: unused since first launch 2026-06-21 (removed 2026-10-30)
    "kicad",
    "kicad-library",
    "bambustudio-appimage",
    "ghostty",
    "cachyos-niri-noctalia",
    "noctalia-qs",
    "noctalia-shell",
    "wine",
    "cachyos-gaming-applications",
    "heroic-games-launcher",
    "lutris",
    "nodejs-lts-jod",
    "brave-bin",
    "gomuks",
    "gomuks-web-bin",
    "proton-cachyos",
    "proton-cachyos-native",
    "electron37",
    "xorg-server",
    "xf86-input-libinput",
    "adw-gtk-theme",
    "capitaine-cursors",
    "cachyos-alacritty-config",
    "wlr-randr",
    "brightnessctl",
    "gpsd",
]

hold = [
    # Installed normally, but excluded from automatic upgrades and rebuilds.
    # Upgrade by hand after reviewing the PKGBUILD and upstream release.
]

# Skipped by install and audit even if listed above.
skip = [
    # Packages to skip during sysup install phases.
    # One package per line. Lines starting with # are ignored.
    # Edit by hand; read by the install and audit phases of sysup.
]

[flatpak]
install = [
    # Flatpak apps — both machines

    # Applications
    "com.usebottles.bottles",
    "com.spotify.Client",
    "ai.storyteller.craft-anything",
    "com.bambulab.BambuStudio",
    # com.ktechpit.whatsie — now installed via AUR (whatsie) instead
    "org.nomacs.ImageLounge",

    # Emulators
    "io.github.shiiion.primehack",
    "org.DolphinEmu.dolphin-emu",
]
# Uninstalled after installs finish, so an app replaced by a package (or a
# renamed app ID) goes only once its replacement is installed.
remove = []

[systemd]
# Enabled (systemctl enable --now). Dropping a unit from these lists disables
# it on the next "Enable system services" run (sysup tracks what it enabled).
enable = [
    "NetworkManager", "bluetooth", "cups", "bpftune", "ananicy-cpp",
    "dmemcg-booster-system", "systemd-oomd", "power-profiles-daemon",
    "snapper-timeline.timer", "snapper-cleanup.timer",
    "greetd", "docker",
]
# User units (systemctl --user). sysup-check.timer: weekly report-only
# health check, unit files in dotset package systemd-user.
# dsearch: DMS file search backend; dcal: Dux Calendar sync + reminders (2026-11-10)
user = ["psd", "mpd", "sysup-check.timer", "dsearch", "dcal"]

[npm]
# Global npm tools (prefix ~/.local, see CLAUDE.md). Installed if missing.
# caveman-code has its own action (setup_caveman_code), so it is not listed.
install = [
    "rea-agents",  # REA reverse-engineering MCP; setup_claude registers it
]

[uv]
# uv tools (uv tool install). Installed if missing.
install = [
    "graphifyy",  # /graphify knowledge-graph skill
]

[ufw]
# Firewall openings, applied by "Enable system services" (`ufw allow <rule>`,
# one rule per entry, any ufw syntax). Add-only: delete a dropped rule by hand.
allow = [
    "2234/tcp",  # nicotine+ (Soulseek) listen port: lets peers browse/download your shares
]
